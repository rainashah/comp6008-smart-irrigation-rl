name: Build farm replay assets
on:
  push:
    paths:
      - '.github/workflows/farm-replay.yml'
      - 'notebooks/05_farm_replay.ipynb'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gymnasium numpy pandas matplotlib torch nbconvert ipykernel
      - name: Execute farm replay notebook
        run: |
          jupyter nbconvert --to notebook --execute notebooks/05_farm_replay.ipynb --output 05_farm_replay.ipynb --output-dir notebooks --ExecutePreprocessor.timeout=900
      - name: Commit executed notebook and exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/05_farm_replay.ipynb outputs/replay
          git diff --cached --quiet || (git commit -m "Export validated 2017 farm replay and video" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-replay-outputs
          path: outputs/replay/
          if-no-files-found: ignore
